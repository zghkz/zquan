# Z全记账助手 · 安卓安装包自动构建
# 用法：仓库根目录先放好 index.html，然后在 Actions 里点「Run workflow」
# 构建完成后到 Releases 下载 Z全记账助手.apk

name: 打包 APK
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
    - name: 安装 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: 安装 Gradle
      run: 'wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip

        unzip -q gradle-8.2-bin.zip

        echo "$GITHUB_WORKSPACE/gradle-8.2/bin" >> "$GITHUB_PATH"

        '
    - name: 生成安卓工程
      run: "          mkdir -p app/src/main/java/com/zquan/ledger \\\n                   app/src/main/res/values \\\n                   app/src/main/res/drawable \\\n                   app/src/main/res/mipmap-anydpi-v26 \\\n                   app/src/main/assets\n\n          cat > settings.gradle <<'APPEOF'\n          pluginManagement {\n              repositories {\n                  google()\n                  mavenCentral()\n                  gradlePluginPortal()\n              }\n          }\n          dependencyResolutionManagement {\n              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n              repositories {\n                  google()\n                  mavenCentral()\n              }\n          }\n          rootProject.name = \"ZQuanLedger\"\n          include ':app'\n          APPEOF\n\n          cat > build.gradle <<'APPEOF'\n          plugins {\n              id 'com.android.application' version '8.1.4' apply false\n          }\n          APPEOF\n\n          cat > gradle.properties <<'APPEOF'\n          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n          android.useAndroidX=true\n          android.enableJetifier=true\n          APPEOF\n\n          cat > app/build.gradle <<'APPEOF'\n          plugins {\n              id 'com.android.application'\n          }\n          \n          android {\n              namespace 'com.zquan.ledger'\n              compileSdk 33\n          \n              defaultConfig {\n                  applicationId \"com.zquan.ledger\"\n                  minSdk 26\n                  targetSdk 33\n                  versionCode 131\n                  versionName \"1.3.1\"\n              }\n          \n              buildTypes {\n                  release {\n                      minifyEnabled false\n                  }\n              }\n          \n              compileOptions {\n                  sourceCompatibility JavaVersion.VERSION_17\n                  targetCompatibility JavaVersion.VERSION_17\n              }\n          }\n          \n          dependencies {\n              implementation 'androidx.appcompat:appcompat:1.6.1'\n              implementation 'androidx.webkit:webkit:1.8.0'\n          }\n          APPEOF\n\n          cat > app/src/main/AndroidManifest.xml <<'APPEOF'\n          <?xml version=\"1.0\" encoding=\"utf-8\"?>\n          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n          \n              <uses-permission android:name=\"android.permission.INTERNET\" />\n          \n              <application\n                  android:allowBackup=\"true\"\n                  android:hardwareAccelerated=\"true\"\n                  android:icon=\"@mipmap/ic_launcher\"\n                  android:label=\"@string/app_name\"\n                  android:roundIcon=\"@mipmap/ic_launcher\"\n                  android:supportsRtl=\"false\"\n                  android:theme=\"@style/AppTheme\">\n          \n                  <activity\n                      android:name=\".MainActivity\"\n                      android:configChanges=\"orientation|screenSize|keyboardHidden|screenLayout|uiMode\"\n                      android:exported=\"true\"\n                      android:screenOrientation=\"portrait\"\n                      android:windowSoftInputMode=\"adjustResize\">\n                      <intent-filter>\n                          <action android:name=\"android.intent.action.MAIN\" />\n                          <category android:name=\"android.intent.category.LAUNCHER\" />\n                      </intent-filter>\n                  </activity>\n              </application>\n          \n          </manifest>\n          APPEOF\n\n          cat > app/src/main/java/com/zquan/ledger/MainActivity.java <<'APPEOF'\n          package com.zquan.ledger;\n          \n          import android.annotation.SuppressLint;\n          import android.app.AlertDialog;\n          import android.content.DialogInterface;\n          import android.content.Intent;\n          import android.graphics.Color;\n          import android.net.Uri;\n          import android.os.Bundle;\n          import android.util.Log;\n          import android.view.KeyEvent;\n          import android.webkit.DownloadListener;\n          import android.webkit.JsResult;\n          import android.webkit.WebChromeClient;\n          import android.webkit.WebResourceRequest;\n          import android.webkit.WebResourceResponse;\n          import android.webkit.WebSettings;\n          import android.webkit.WebView;\n          import android.webkit.WebViewClient;\n          \n          import androidx.appcompat.app.AppCompatActivity;\n          import androidx.webkit.WebViewAssetLoader;\n          \n          public class MainActivity extends AppCompatActivity {\n          \n              private static final String DOMAIN = \"appassets.androidplatform.net\";\n              private static final String HOME = \"https://\" + DOMAIN + \"/assets/index.html\";\n              private WebView web;\n              private WebViewAssetLoader loader;\n          \n              @SuppressLint(\"SetJavaScriptEnabled\")\n              @Override\n              protected void onCreate(Bundle b) {\n                  super.onCreate(b);\n          \n                  loader = new WebViewAssetLoader.Builder()\n                          .setDomain(DOMAIN)\n                          .addPathHandler(\"/assets/\", new WebViewAssetLoader.AssetsPathHandler(this))\n                          .build();\n          \n                  web = new WebView(this);\n                  setContentView(web);\n                  web.setBackgroundColor(Color.parseColor(\"#0A6B41\"));\n          \n                  WebSettings s = web.getSettings();\n                  s.setJavaScriptEnabled(true);\n                  s.setDomStorageEnabled(true);\n                  s.setDatabaseEnabled(true);\n                  s.setUseWideViewPort(true);\n                  s.setLoadWithOverviewMode(false);\n                  s.setSupportZoom(false);\n                  s.setBuiltInZoomControls(false);\n                  s.setMediaPlaybackRequiresUserGesture(false);\n                  s.setUserAgentString(s.getUserAgentString() + \" ZQuanApp/1.3.1\");\n          \n                  web.setWebViewClient(new WebViewClient() {\n                      @Override\n                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest req) {\n                          return loader.shouldInterceptRequest(req.getUrl());\n                      }\n          \n                      @Override\n                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {\n                          String u = req.getUrl().toString();\n                          if (u != null && u.contains(DOMAIN)) {\n                              return false;\n                          }\n                          try {\n                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u)));\n                          } catch (Exception e) {\n                              Log.w(\"ZQuan\", \"open link failed\", e);\n                          }\n                          return true;\n                      }\n                  });\n          \n                  web.setWebChromeClient(new WebChromeClient() {\n                      @Override\n                      public boolean onJsAlert(WebView v, String url, String msg, JsResult r) {\n                          new AlertDialog.Builder(v.getContext())\n                                  .setMessage(msg)\n                                  .setPositiveButton(\"确定\", new DialogInterface.OnClickListener() {\n                                      public void onClick(DialogInterface d, int w) {\n                                          r.confirm();\n                                      }\n                                  })\n                                  .setCancelable(false)\n                                  .show();\n                          return true;\n                      }\n          \n                      @Override\n                      public boolean onJsConfirm(WebView v, String url, String msg, JsResult r) {\n                          new AlertDialog.Builder(v.getContext())\n                                  .setMessage(msg)\n                                  .setPositiveButton(\"确定\", new DialogInterface.OnClickListener() {\n                                      public void onClick(DialogInterface d, int w) {\n                                          r.confirm();\n                                      }\n                                  })\n                                  .setNegativeButton(\"取消\", new DialogInterface.OnClickListener() {\n                                      public void onClick(DialogInterface d, int w) {\n                                          r.cancel();\n                                      }\n                                  })\n                                  .show();\n                          return true;\n                      }\n                  });\n          \n                  web.setDownloadListener(new DownloadListener() {\n                      public void onDownloadStart(String url, String ua, String cd, String mime, long len) {\n                          try {\n                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));\n                          } catch (Exception e) {\n                              Log.w(\"ZQuan\", \"download failed\", e);\n                          }\n                      }\n                  });\n          \n                  if (b == null) {\n                      web.loadUrl(HOME);\n                  }\n              }\n          \n              @Override\n              public boolean onKeyDown(int code, KeyEvent e) {\n                  if (code == KeyEvent.KEYCODE_BACK && web != null && web.canGoBack()) {\n                      web.goBack();\n                      return true;\n                  }\n                  return super.onKeyDown(code, e);\n              }\n          }\n          APPEOF\n\n          cat > app/src/main/res/values/strings.xml <<'APPEOF'\n          <?xml version=\"1.0\" encoding=\"utf-8\"?>\n          <resources>\n              <string name=\"app_name\">Z全记账</string>\n          </resources>\n          APPEOF\n\n          cat > app/src/main/res/values/colors.xml <<'APPEOF'\n          <?xml version=\"1.0\" encoding=\"utf-8\"?>\n          <resources>\n              <color name=\"brand\">#0A6B41</color>\n              <color name=\"brand_light\">#10B981</color>\n          </resources>\n          APPEOF\n\n          cat > app/src/main/res/values/themes.xml <<'APPEOF'\n          <?xml version=\"1.0\" encoding=\"utf-8\"?>\n          <resources>\n              <style name=\"AppTheme\" parent=\"Theme.AppCompat.Light.NoActionBar\">\n                  <item name=\"colorPrimary\">@color/brand</item>\n                  <item name=\"colorPrimaryDark\">@color/brand</item>\n                  <item name=\"colorAccent\">@color/brand_light</item>\n                  <item name=\"android:statusBarColor\">@color/brand</item>\n                  <item name=\"android:windowBackground\">@color/brand</item>\n              </style>\n          </resources>\n          APPEOF\n\n          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'APPEOF'\n          <?xml version=\"1.0\" encoding=\"utf-8\"?>\n          <vector xmlns:android=\"http://schemas.android.com/apk/res/android\"\n              android:width=\"108dp\"\n              android:height=\"108dp\"\n              android:viewportWidth=\"108\"\n              android:viewportHeight=\"108\">\n              <path\n                  android:fillColor=\"#16A34A\"\n                  android:pathData=\"M0,0h108v108h-108z\" />\n          </vector>\n          APPEOF\n\n          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'APPEOF'\n          <?xml version=\"1.0\" encoding=\"utf-8\"?>\n          <vector xmlns:android=\"http://schemas.android.com/apk/res/android\"\n              android:width=\"108dp\"\n              android:height=\"108dp\"\n              android:viewportWidth=\"108\"\n              android:viewportHeight=\"108\">\n              <path\n                  android:pathData=\"M54,30 L37,51\"\n                  android:strokeWidth=\"6\"\n                  android:strokeColor=\"#FFFFFF\"\n                  android:strokeLineCap=\"round\" />\n              <path\n                  android:pathData=\"M54,30 L71,51\"\n                  android:strokeWidth=\"6\"\n                  android:strokeColor=\"#FFFFFF\"\n                  android:strokeLineCap=\"round\" />\n              <path\n                  android:pathData=\"M54,44 L54,78\"\n                  android:strokeWidth=\"6\"\n                  android:strokeColor=\"#FFFFFF\"\n                  android:strokeLineCap=\"round\" />\n              <path\n                  android:pathData=\"M39,60 L69,60\"\n                  android:strokeWidth=\"5.5\"\n                  android:strokeColor=\"#FFFFFF\"\n                  android:strokeLineCap=\"round\" />\n              <path\n                  android:pathData=\"M39,70 L69,70\"\n                  android:strokeWidth=\"5.5\"\n                  android:strokeColor=\"#FFFFFF\"\n                  android:strokeLineCap=\"round\" />\n          </vector>\n          APPEOF\n\n          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'APPEOF'\n          <?xml version=\"1.0\" encoding=\"utf-8\"?>\n          <adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">\n              <background android:drawable=\"@drawable/ic_launcher_background\" />\n              <foreground android:drawable=\"@drawable/ic_launcher_foreground\" />\n          </adaptive-icon>\n          APPEOF\n\n"
    - name: 放入网页文件
      run: "if [ -f index.html ]; then\n  cp index.html app/src/main/assets/index.html\n  echo \"已放入 index.html\"\nelse\n  echo \"仓库根目录缺少 index.html，请先用 Add file 上传它\"\n  exit 1\nfi\n"
    - name: 配置 SDK 路径
      run: 'SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

        echo "sdk.dir=$SDK" > local.properties

        '
    - name: 编译安装包
      run: gradle assembleDebug --no-daemon
    - name: 整理安装包
      run: 'mkdir -p out

        cp app/build/outputs/apk/debug/app-debug.apk out/Z全记账助手.apk

        ls -lh out

        '
    - name: 发布到 Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: apk-latest
        name: Z全记账助手 安装包
        body: '安卓 APK 安装包，下载后直接安装即可（若提示未知来源，选允许）。


          记账数据保存在手机本地，不会上传服务器。


          更新方式：覆盖安装新版本，数据不会丢失。'
        files: out/Z全记账助手.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
